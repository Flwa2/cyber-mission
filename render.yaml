services:
  - type: web
    name: cyber-mission
    runtime: node
    plan: standard
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cyber-mission-db
          property: connectionString

databases:
  - name: cyber-mission-db
    plan: basic-1gb
    region: frankfurt
    postgresMajorVersion: "18"
